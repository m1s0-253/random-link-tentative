  <title>ランダム転送</title>
</head>
<body>

  <p>ページを選んでいます……</p>

  <script>
    // 飛ばしたいURLをここに入れる
    const urls = [
      "https://draw.kuku.lu/pchat.php?hash=937133278",
      "https://draw.kuku.lu/pchat.php?hash=650168596",
      "https://draw.kuku.lu/pchat.php?hash=667025100",

    // ランダムに1つ選ぶ
    const randomUrl = urls[Math.floor(Math.random() * urls.length)];

    // 選ばれたURLへ移動
    window.location.href = randomUrl;
  </script>
